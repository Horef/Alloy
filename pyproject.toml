[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-eval-poc"
version = "0.1.0"
description = "Coverage-first silver question generation and chatbot evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chatbot-eval = "chatbot_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
