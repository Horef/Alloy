[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-eval-poc"
version = "1.0.0"
description = "Coverage-first silver question generation and chatbot evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chatbot-eval = "chatbot_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# tools/docmap.py: project map, code lookups and doc-health checks (see tools/README.md).
[tool.docmap]
link_exempt = ["docs/archive/*"]   # dated records; their relative links are historical
agents_max_lines = 120

# docs/FACTS.md: key defaults read from the shipped config; docs cite it instead of copying the value.
[tool.docmap.facts]
"generation model" = { file = "config.example.toml", key = "gemini.generation_model" }
"judge model" = { file = "config.example.toml", key = "gemini.judge_model" }
"sampling seed" = { file = "config.example.toml", key = "gemini.seed" }
"max questions" = { file = "config.example.toml", key = "generation.max_questions" }
"chunk size (chars)" = { file = "config.example.toml", key = "generation.chunk_chars" }
"topic mode" = { file = "config.example.toml", key = "generation.topic_mode" }
"unanswerable ratio" = { file = "config.example.toml", key = "generation.unanswerable_ratio" }

[[tool.docmap.forbid]]
source = "chatbot_eval"
except = ["chatbot_eval.llm"]
imports = ["google"]
reason = "only llm.py talks to the Gemini SDK; other modules depend on the StructuredLLM protocol, so they run with fakes"

[[tool.docmap.forbid]]
source = "chatbot_eval"
imports = ["chatbot_eval.cli"]
reason = "cli.py is the only module that wires components together"

# Every command writes run_manifest.json (report_manifest.json for `report`) into its output folder.
[tool.docmap.runs]
manifests = "**/outputs/**/*_manifest.json"
out = "docs/RUNS.md"
columns = { run = "run_id", started = "started_at", command = "command", status = "status", commit = "git_commit", dirty = "git_worktree_dirty", code = "implementation_sha256" }
