[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-eval-poc"
version = "1.0.0"
description = "Coverage-first silver question generation and chatbot evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chatbot-eval = "chatbot_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# tools/docmap.py: project map, code lookups and doc-health checks (see tools/README.md).
[tool.docmap]
link_exempt = ["docs/archive/*"]   # dated records; their relative links are historical
agents_max_lines = 100
# Doc lifecycle: every doc in docs/ opens with a Status line (plans keep their own "Status: proposed | ..." line).
lifecycle_exempt = ["docs/README.md", "docs/plans/*"]
lifecycle_strict = true

# docs/FACTS.md: key defaults read from their source; docs cite it instead of copying values.
[tool.docmap.facts]
"code default chunk_chars" = { file = "src/chatbot_eval/config.py", pattern = '"chunk_chars", (\d+)\)', note = "D2" }
"code default chunk_overlap_chars" = { file = "src/chatbot_eval/config.py", pattern = '"chunk_overlap_chars", (\d+)\)', note = "D2" }
"example chunk_chars" = { file = "config.example.toml", key = "generation.chunk_chars", note = "D2" }
"example chunk_overlap_chars" = { file = "config.example.toml", key = "generation.chunk_overlap_chars", note = "D2" }
"default max_graph_topics" = { file = "src/chatbot_eval/config.py", pattern = '"max_graph_topics", (\d+)\)', note = "D3" }
"default topic_mode" = { file = "src/chatbot_eval/config.py", pattern = '"topic_mode", "(\w+)"\)', note = "D4" }
"default generation.mode" = { file = "src/chatbot_eval/config.py", pattern = '"generation", "mode", "(\w+)"\)', note = "D10" }
"generation modes" = { file = "src/chatbot_eval/models.py", pattern = '^GENERATION_MODES = \((.+)\)' }
"default max_questions" = { file = "src/chatbot_eval/config.py", pattern = '"max_questions", (\d+)\)' }
"default generation_model" = { file = "src/chatbot_eval/config.py", pattern = '"generation_model", "([^"]+)"\)' }
"default judge_model" = { file = "src/chatbot_eval/config.py", pattern = '"judge_model", "([^"]+)"\)' }
"PDF CONVERTER_VERSION" = { file = "src/chatbot_eval/pdf_markdown.py", pattern = '^CONVERTER_VERSION = (\d+)' }

[[tool.docmap.forbid]]
source = "chatbot_eval"
except = ["chatbot_eval.llm"]
imports = ["google"]
reason = "only llm.py talks to the Gemini SDK; other modules depend on the StructuredLLM protocol, so they run with fakes"

[[tool.docmap.forbid]]
source = "chatbot_eval"
imports = ["chatbot_eval.cli"]
reason = "cli.py is the only module that wires components together"

# Every command writes run_manifest.json (report_manifest.json for `report`) into its output folder.
[tool.docmap.runs]
manifests = "**/outputs/**/*_manifest.json"
out = "docs/RUNS.md"
columns = { run = "run_id", started = "started_at", command = "command", status = "status", commit = "git_commit", dirty = "git_worktree_dirty", code = "implementation_sha256" }
