# Profile schema template: the personal-data fields the chatbot platform puts in its prompt.
# Copy to profile_schema.toml and confirm every value list against real (non-committed) data.
# Check it with: chatbot-eval profile-check --schema profile_schema.toml [--profile synthetic.json]
# Never put a real person's profile in this file; it describes fields, not people.
#
# Keys and labels follow the platform server (preProd code read 2026-10-27): it renders the enabled
# fields as "label: value, label: value" after "להלן פרטי המשתמש:" in the system prompt, using the
# labels below (מין and סטטוס, not the admin screen's מגדר and מצב משפחתי) and an enum's description.
#
# type: enum | date | bool | number | text | id
# use: condition (documents may make answers depend on it) | identifier_only | excluded (not sent)
# sensitivity: ordinary | special_category | identifier (identifiers can never be conditions)
# open_values = true: the platform may hold values not listed; personas use only the listed ones.
# sample_values: values personas take for a date or number field, or for a derived field.
# aliases / label_aliases: other words the documents use for an enum value / for the field itself.
# [[constraints]] (see the end of the file) keep synthetic personas believable.

version = 1

[[fields]]
key = "firstName"
label = "שם פרטי"
group = "פרטים אישיים"
type = "text"
sensitivity = "identifier"
use = "identifier_only"

[[fields]]
key = "lastName"
label = "שם משפחה"
group = "פרטים אישיים"
type = "text"
sensitivity = "identifier"
use = "identifier_only"

[[fields]]
key = "gender"
label = "מין"
group = "פרטים אישיים"
type = "enum"
values = ["זכר", "נקבה"]
open_values = true
sensitivity = "special_category"

# Words the documents use for a value; rule extraction accepts them as naming the condition and lists
# them in its prompt. Predicates still use the listed value. Use words that tell the values apart
# ("חייל" and "חיילת" share a stem, so they cannot).
[fields.aliases]
"זכר" = ["גבר", "גברים"]
"נקבה" = ["אשה", "נשים"]

[[fields]]
key = "birthDate"
label = "תאריך לידה"
group = "פרטים אישיים"
type = "date"
# The platform prints the database string as is; confirm its format.
date_format = "%Y-%m-%d"

[[fields]]
key = "religion"
label = "דת"
group = "פרטים אישיים"
type = "enum"
values = ["יהודי", "מוסלמי", "נוצרי", "דרוזי", "אחר"]
open_values = true
sensitivity = "special_category"

[fields.aliases]
"מוסלמי" = ["אסלאם"]

[[fields]]
key = "tashFamilyStatus"
label = "סטטוס"
group = "פרטים אישיים"
type = "enum"
# The population registry's four statuses plus two that forms use; confirm the platform's spelling.
values = ["רווק", "נשוי", "גרוש", "אלמן", "פרוד", "ידוע בציבור"]
open_values = true

[[fields]]
key = "serviceType"
label = "סוג שירות"
group = "נתוני שירות"
type = "enum"
values = ["חובה", "קבע", "מילואים"]
open_values = true

# The admin screen has toggles for these three, but the platform neither fetches nor labels them,
# so they never reach the prompt. Switch `use` to "condition" (ID: "identifier_only") once it does.
[[fields]]
key = "id"
label = "מספר מזהה"
group = "נתוני שירות"
type = "id"
sensitivity = "identifier"
use = "excluded"

[[fields]]
key = "releaseDate"
label = "תאריך שחרור"
group = "נתוני שירות"
type = "date"
use = "excluded"

[[fields]]
key = "endMandatoryService"
label = "סיום שירות חובה"
group = "נתוני שירות"
type = "date"
use = "excluded"

# Derived fields are computed against the question set's pinned as-of date.
[[derived]]
key = "age"
label = "גיל"
source = "birthDate"
derivation = "years_since"
sample_values = [18, 21, 26]

# Once releaseDate and endMandatoryService reach the prompt, add for example:
# [[derived]]
# key = "months_since_release"
# label = "חודשים מהשחרור"
# source = "releaseDate"
# derivation = "months_since"

# Persona constraints. With a count field and a child's fields (one entry stands for the children):
# a persona with no children has no child fields, one with a child has at least one, and a child is
# born at least 16 years after its parent. A combination these forbid is simply not generated.
# [[constraints]]
# kind = "count_matches_entries"
# count = "numberOfChildren"
# entries = ["childrenInfo.childBirthDate"]
#
# [[constraints]]
# kind = "date_gap"
# earlier = "birthDate"
# later = "childrenInfo.childBirthDate"
# min_years = 16
#
# A bool or other field the documents word differently takes `label_aliases = ["אסיר", "כליאה"]`.
