[gemini]
# Use "direct" for Google Gemini or "apigee" for the internal AI Gateway.
transport = "direct"
# The secret itself belongs in .env; this file only names the environment variable.
api_key_env = "GEMINI_API_KEY"
apigee_api_key_env = "APIGEE_API_KEY"
apigee_base_url = "https://preprod.apigee.digital.idf.il/ai_gateway/v1/hr"
generation_model = "gemini-3.7-flash"
judge_model = "gemini-3.7-flash"

[generation]
max_questions = 30
chunk_chars = 12000
chunk_overlap_chars = 800
batch_chunks = 8
unanswerable_ratio = 0.10
# Share of the total set derived from canonical questions using natural user phrasing.
user_variation_ratio = 0.30
# Share of those variations that should require a clarifying follow-up.
ambiguous_variation_share = 0.33
# Bounded attempts to refill rejected or duplicate candidates.
max_candidate_rounds = 3
stable_question_ids = true
question_type_targets = { basic_knowledge = 0.50, topic_integration = 0.30, document_wide = 0.10, cross_document = 0.10 }
min_topic_questions = 1
max_topic_share = 0.35

[cache]
# Reuse locally extracted chunks and Gemini-discovered topic maps when document content and
# relevant generation settings are unchanged.
enabled = true
directory = ".chatbot_eval_cache"

[evaluation]
request_timeout_seconds = 60
max_retries = 2
chatbot_max_retries = 2
chatbot_retry_base_seconds = 0.5
chatbot_pacing_seconds = 0.0
chatbot_max_response_bytes = 5000000
chatbot_require_json_content_type = true

[runtime]
# Set to false in production/non-interactive jobs.
progress_enabled = true
# Leave empty to disable file logging. CLI --log-file overrides this.
log_file = ""
log_level = "INFO"
