[gemini]
# Use "direct" for Google Gemini or "apigee" for the internal AI Gateway.
transport = "direct"
# The secret itself belongs in .env; this file only names the environment variable.
api_key_env = "GEMINI_API_KEY"
apigee_api_key_env = "APIGEE_API_KEY"
apigee_base_url = "https://preprod.apigee.digital.idf.il/ai_gateway/v1/hr"
generation_model = "gemini-3.7-flash"
judge_model = "gemini-3.7-flash"
# Fixed sampling seed for every structured call, so identical prompts give identical responses and
# the persistent call cache can serve repeats. Use -1 for fresh sampling (disables the call cache).
seed = 7

[generation]
max_questions = 30
# Moderate chunk size (~500 tokens): reliable for per-chunk signal extraction and gives each
# document multiple knowledge-graph nodes, while keeping a typical rule/procedure within one chunk.
chunk_chars = 2000
chunk_overlap_chars = 200
batch_chunks = 8
unanswerable_ratio = 0.10
# Share of the total set derived from canonical questions using natural user phrasing.
user_variation_ratio = 0.30
# Share of those variations that should require a clarifying follow-up.
ambiguous_variation_share = 0.33
# Bounded attempts to refill rejected or duplicate candidates.
max_candidate_rounds = 3
stable_question_ids = true
question_type_targets = { basic_knowledge = 0.50, topic_integration = 0.30, document_wide = 0.10, cross_document = 0.10 }
min_topic_questions = 1
max_topic_share = 0.35
# Knowledge-graph generation (v1.0+). Topics and per-question evidence come from a corpus knowledge
# graph rather than lexical topic-label overlap. Node signals are extracted per document and cached,
# so only added or edited documents are re-extracted on a later run.
graph_extraction_batch_chunks = 8   # chunks per signal-extraction call
keyphrase_overlap_threshold = 0.3   # Jaccard threshold for a keyphrase_overlap edge, in (0, 1]
max_graph_topics = 40               # cap on graph-derived topics; excess small clusters bin-pack into bounded "other" buckets
min_cluster_nodes = 1               # smallest standalone cluster before merging into "other"
max_cluster_nodes = 12              # max graph nodes assembled as evidence for one topic's questions
questions_per_call = 8              # most questions requested per model call; larger quotas use more windows
context_nodes = 4                   # neighbor chunks shown with each focus window for integration questions
min_cluster_edge_weight = 2.0       # min shared-entity strength to merge nodes into one topic (avoids hairball)
max_cluster_size = 40               # oversized clusters are split by weakest-edge removal
# Topic layer. "theme" (default) tags each chunk with one theme from a small controlled vocabulary
# and groups by theme, so a subject spread across the corpus (e.g. pay) becomes its own topic even
# when its chunks share few entities — topic coverage self-organizes (create-and-read). "entity"
# clusters chunks by shared entities instead, which can fragment sparse corpora and bury thin
# themes. Theme mode costs one extra vocabulary call plus a one-time re-extraction of node signals;
# themes are a separate layer from entities and never create edges. See docs/theme-layer-ab-results.md.
topic_mode = "theme"                # "theme" (default) or "entity"
extract_themes = false              # tag chunks with a theme without switching clustering (implied by theme mode)
max_theme_vocabulary = 20           # ceiling on the controlled theme vocabulary size
# Re-check each generated reference answer against evidence re-selected for that specific question
# (not just its topic), to catch answers left incomplete or wrong by narrow topic-driven chunk
# selection. Costs one extra model call per answerable canonical candidate. Off by default.
verify_answer_completeness = false
completeness_evidence_limit = 16
# Optional embedding model (empty = off). When set, retrieval fuses BM25 with dense ranking and
# near-duplicate questions are also caught semantically. Vectors are cached under the cache dir.
embedding_model = ""                # e.g. "gemini-embedding-2" via the Apigee gateway
embedding_dimensions = 768
semantic_duplicate_threshold = 0.92
# Re-check each boundary question against evidence retrieved from the whole corpus (one call each).
verify_unanswerable = false
unanswerable_evidence_limit = 16
# Closed-book check (two small calls per canonical candidate): "off", "tag" marks questions a model
# answers fully without the documents (closed_book_answerable=true) and keeps them, "reject" drops them.
# Replaces the legacy boolean filter_closed_book_answerable (true meant "reject").
closed_book_check = "off"
# Record failed model calls as shortfalls and finish the run instead of aborting (then --resume later).
continue_on_call_failure = false
# Canonical questions sent per variation-generation call.
variation_batch_size = 30
# "standard": canonical questions plus user variants for some of them. "user_facing": every canonical
# and boundary question also gets one natural user phrasing; the canonical form becomes its anchor.
mode = "standard"
# Broad overview questions ("מה הזכויות שלי?"): corpus-level, per population the documents address, and
# one per topic. Each key point is checked against the cited documents' text.
broad_questions = false
broad_corpus_questions = 2
broad_population_limit = 8
broad_min_key_points = 3
# Independent prompt-generation budgets keep large corpora and prior runs from creating unbounded calls.
prompt_max_document_chars = 100000
prompt_max_evaluation_chars = 60000
prompt_max_auxiliary_chars = 30000
# Code-assembled behavioral policy profile: "guided" includes illustrative examples; "compact" omits them.
prompt_instruction_profile = "guided"
# "balanced" permits a clearly separated supported partial answer; "conservative" abstains from an unsupported conclusion.
prompt_answer_policy = "balanced"

[planning]
# Automatic sizing used by `plan`, `generate --auto-plan`, and `generate --plan` (see the README).
coverage_target = 0.35              # share of each chunk's information units its questions should touch
claims_per_question = 3.2           # average atomic claims per canonical question
margin_of_error = 0.20              # 95% CI half-width per topic; sets a per-topic minimum (0 disables)
max_topic_coverage = 0.6            # the per-topic minimum never exceeds this share of a topic's units
variation_share = 0.5               # natural + ambiguous variants per canonical question
min_boundary_per_topic = 2          # minimum boundary (unanswerable) questions per topic

[cache]
# Reuse locally extracted chunks and Gemini-discovered topic maps when document content and
# relevant generation settings are unchanged.
enabled = true
directory = ".chatbot_eval_cache"

[evaluation]
# Anchors (canonical intents of user_facing sets): "gap" = judged but reported only as the phrasing
# gap, "include" = also counted in headline metrics, "exclude" = not sent to the chatbot.
canonical_scoring = "gap"
request_timeout_seconds = 60
max_retries = 2
chatbot_max_retries = 2
chatbot_retry_base_seconds = 0.5
chatbot_pacing_seconds = 0.0
chatbot_max_response_bytes = 5000000
chatbot_require_json_content_type = true
judge_max_answer_chars = 20000
judge_max_context_chars = 60000
insights_max_prompt_chars = 80000
gemini_request_timeout_seconds = 120
# Keep 1 for session-sensitive chatbots. Increase only for stateless endpoints and available quota.
max_concurrency = 1
# Optional nonsecret identity for the chatbot deployment is supplied per run with --deployment-id.

[runtime]
# Set to false in production/non-interactive jobs.
progress_enabled = true
# Leave empty to disable file logging. CLI --log-file overrides this.
log_file = ""
log_level = "INFO"
